name: Deploy SFC to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
          test -s _site/index.html
          echo 'Prepared site files:'
          ls -lah _site
      - name: Upload GitHub Pages artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages
      - name: Verify artifact upload
        run: |
          echo "Pages artifact ID: ${{ steps.pages_artifact.outputs.artifact_id }}"
          test -n "${{ steps.pages_artifact.outputs.artifact_id }}"
      - id: deployment
        uses: actions/deploy-pages@v4
