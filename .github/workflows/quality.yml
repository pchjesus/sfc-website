name: SFC static checks
on:
  push:
    branches: [main, preview/sfc-v2.4-about-activities, preview/sfc-v2.5-v2.6-integrated]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/preview-capture.py
        if: github.ref_name == 'preview/sfc-v2.5-v2.6-integrated'
      - uses: actions/upload-artifact@v4
        if: github.ref_name == 'preview/sfc-v2.5-v2.6-integrated'
        with:
          name: sfc-v2.6-integrated-visual-previews
          path: preview/screenshots/*.png
          retention-days: 30


      - run: python tests/browser-check.py
      - run: python tests/integrated-check.py
